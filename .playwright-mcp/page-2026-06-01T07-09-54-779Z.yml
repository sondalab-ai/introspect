          - heading "Pause level" [level=2] [ref=e79]
          - paragraph [ref=e80]: "Multi-file changes, refactors, new features, non-obvious architecture: brief proposal (2-4 sentences) in chat, wait for OK. Single-file localized changes: skip proposal."
